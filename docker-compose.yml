services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # REST API & Dashboard
      - "6334:6334" # gRPC API
    volumes:
        - C:\test\qdrant_storage:/qdrant/storage
        - C:\test\qdrant_config:/qdrant/config

  seq:
    image: datalust/seq:latest
    container_name: seq
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=True # Optional: disable auth for local dev (or use SEQ_PASSWORD)
    ports:
      - "5341:80"     # Web UI mapped to host 5341 (or use "-p 8080:80" for UI and "-p 5341:5341" for ingest)
    volumes:
      - C:\test\seq_data:/data